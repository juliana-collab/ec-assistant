<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PM Assistant · Edit Crew</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f8f6; --surface: #ffffff; --border: #e4e2dc; --border-strong: #c8c5bc;
  --text: #1a1a18; --text-muted: #6b6b67; --text-hint: #9b9b96; --accent: #1a1a2e;
  --danger-bg: #fef2f2; --danger-border: #fca5a5; --danger-text: #991b1b;
  --warning-bg: #fffbeb; --warning-border: #fcd34d; --warning-text: #92400e;
  --success-bg: #f0fdf4; --success-border: #86efac; --success-text: #166534;
  --info-bg: #eff6ff; --info-border: #93c5fd; --info-text: #1e40af;
  --radius: 10px; --radius-sm: 6px;
  --header-h: 56px; --input-h: 80px;
}
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* Header */
.header { height: var(--header-h); background: var(--surface); border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; color: #fff; flex-shrink: 0; }
.header-title { font-size: 14px; font-weight: 600; }
.header-sub { font-size: 11px; color: var(--text-muted); }
.btn-clear { background: transparent; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px; color: var(--text-muted); cursor: pointer; font-family: inherit; }
.btn-clear:hover { background: var(--bg); }

/* Chat area */
.chat-area { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }

/* Messages */
.msg-group { display: flex; flex-direction: column; gap: 6px; }
.msg-row { display: flex; gap: 8px; align-items: flex-end; }
.msg-row.user { flex-direction: row-reverse; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.avatar.ec { background: var(--accent); color: #fff; }
.avatar.pm { background: var(--border-strong); color: var(--text-muted); }
.bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.65; }
.bubble.ec { background: var(--surface); border: 0.5px solid var(--border); border-radius: 4px 14px 14px 14px; color: var(--text); }
.bubble.pm { background: var(--accent); color: #fff; border-radius: 14px 4px 14px 14px; }
.bubble strong { font-weight: 600; }
.bubble ul { padding-left: 1.2rem; margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.bubble li { font-size: 13px; }
.msg-time { font-size: 10px; color: var(--text-hint); padding: 0 4px; }

/* Banners inside bubble */
.mini-banner { border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; display: flex; gap: 8px; }
.mini-banner.danger { background: var(--danger-bg); border: 0.5px solid var(--danger-border); }
.mini-banner.warning { background: var(--warning-bg); border: 0.5px solid var(--warning-border); }
.mini-banner.success { background: var(--success-bg); border: 0.5px solid var(--success-border); }
.mini-banner-body { flex: 1; }
.mini-banner-title { font-size: 12px; font-weight: 700; }
.mini-banner-title.danger { color: var(--danger-text); }
.mini-banner-title.warning { color: var(--warning-text); }
.mini-banner-title.success { color: var(--success-text); }
.mini-steps { list-style: none; padding: 0; margin-top: 5px; display: flex; flex-direction: column; gap: 4px; }
.mini-steps li { font-size: 12px; display: flex; gap: 6px; line-height: 1.4; }
.mini-steps li::before { content: "→"; font-weight: 700; flex-shrink: 0; }
.mini-steps li.danger { color: var(--danger-text); }
.mini-steps li.warning { color: var(--warning-text); }
.mini-steps li.success { color: var(--success-text); }
.sop-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.sop-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--info-bg); border: 0.5px solid var(--info-border); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--info-text); text-decoration: none; font-weight: 500; }
.sop-chip:hover { opacity: 0.75; }
.sop-chip::after { content: " ↗"; opacity: 0.6; }
.response-block { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; }
.response-label { font-size: 10px; font-weight: 700; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.response-text { font-size: 13px; color: var(--text); line-height: 1.7; white-space: pre-wrap; }
.copy-btn { margin-top: 8px; background: transparent; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); padding: 5px 12px; font-size: 11px; color: var(--text-muted); cursor: pointer; font-family: inherit; }
.copy-btn:hover { background: var(--border); }

/* Suggestions */
.suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 0.5rem; }
.suggestion { background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--text-muted); cursor: pointer; font-family: inherit; }
.suggestion:hover { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }

/* Typing indicator */
.typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-hint); animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

/* Input */
.input-area { background: var(--surface); border-top: 0.5px solid var(--border); padding: 0.75rem 1.25rem; flex-shrink: 0; padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
.input-row { display: flex; gap: 8px; align-items: flex-end; background: var(--bg); border: 0.5px solid var(--border-strong); border-radius: 12px; padding: 8px 8px 8px 14px; }
.input-row:focus-within { border-color: var(--accent); }
.chat-input { flex: 1; border: none; background: transparent; font-size: 14px; color: var(--text); font-family: inherit; resize: none; max-height: 120px; line-height: 1.5; outline: none; }
.chat-input::placeholder { color: var(--text-hint); }
.send-btn { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s; }
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.send-btn svg { width: 14px; height: 14px; fill: #fff; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">EC</div>
    <div>
      <div class="header-title">PM Assistant</div>
      <div class="header-sub">Edit Crew · SOP Bible + T&C</div>
    </div>
  </div>
  <button class="btn-clear" onclick="clearHistory()">↺ Nueva conversación</button>
</div>

<div class="chat-area" id="chat-area">
  <!-- Messages render here -->
</div>

<div class="input-area">
  <div class="input-row">
    <textarea class="chat-input" id="chat-input" placeholder="Pega un mensaje de cliente o haz una pregunta de PM..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ─── SOP Bible links ───────────────────────────────────────────────────
const SOPS = [
  { name: "How to Handle Clients", keys: ["handle client","difficult client","angry client","upset client","client complain","comunicación con cliente","trato al cliente","cliente difícil"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-6957" },
  { name: "SOP for Account Management", keys: ["account management","gestión de cuenta","manage account","pm process","pm workflow","revision","revisión","feedback","entrega","delivery","turnaround"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-8757" },
  { name: "Client Portal (ManyRequests)", keys: ["portal","manyrequests","many requests","client login","client access","acceso cliente"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-8877" },
  { name: "Contingency Plan with Clients", keys: ["contingency","contingencia","cancel","cancelar","churn","baja","losing client","unhappy","insatisfecho","escalat","at risk"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-6917" },
  { name: "Client Messages & Templates", keys: ["message template","plantilla","template","canned response","respuesta predefinida","how to respond","how to reply","qué responder"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-4077" },
  { name: "Client Onboardings", keys: ["onboard","onboarding","new client","nuevo cliente","welcome","bienvenida","first week","primera semana","one sheet"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-6957" },
  { name: "Scope of Work", keys: ["scope","alcance","what is included","what's included","qué incluye","paquete","package","plan","subscription"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-8837" },
  { name: "SOPs for Account Management", keys: ["sop","process doc","procedimiento","standard operating","proceso estándar"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-7577" },
  { name: "Transitioning an Account to Another PM", keys: ["transition","handoff","transfer","cambio de pm","new pm","pm change","traspaso"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-4297" },
  { name: "How to Handle Editors", keys: ["editor","handle editor","editor issue","editor problem","editor wiki","editor performance"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-4197" },
  { name: "POI for PMs", keys: ["poi","point of interest","reference links","links importantes","bookmarks"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-4177" },
  { name: "Sheets and Forms", keys: ["sheet","form","google sheet","formulario","spreadsheet","tracking sheet"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-4077" },
  { name: "Suite Studios Wiki", keys: ["suite studios","studio wiki","brand","marca"], url: "https://app.clickup.com/10628585/docs/a4bf9-5097/a4bf9-3877" },
];

function getSops(text) {
  const lower = text.toLowerCase();
  const matched = SOPS.filter(s => s.keys.some(k => lower.includes(k)));
  // Deduplicate by url, keep max 3
  const seen = new Set();
  return matched.filter(s => { if (seen.has(s.url)) return false; seen.add(s.url); return true; }).slice(0, 3);
}

// ─── Escalation detection ──────────────────────────────────────────────
const HIGH_ESC = ["raising this with","escalating","cancel my","cancel subscription","refund","devolver","reembolso","lawyer","abogado","legal action","publicly","social media","redes sociales","breach of contract","done with this","fed up","had enough","this is unacceptable","not what was promised","said repeatedly","incompetent","worst service","never again","going elsewhere","i want out","demand"];
const MED_ESC = ["frustrated","very disappointed","waiting too long","no response","been ignored","weeks now","not good enough","expected more","you promised","poor communication","terrible experience","very unhappy","not happy"];

function getEsc(text) {
  const lower = text.toLowerCase();
  const hf = HIGH_ESC.filter(k => lower.includes(k));
  const mf = MED_ESC.filter(k => lower.includes(k));
  if (hf.length > 0) return { level: "high", flags: hf };
  if (mf.length >= 2) return { level: "high", flags: mf };
  if (mf.length > 0) return { level: "medium", flags: mf };
  return { level: "low", flags: [] };
}

// ─── History (localStorage) ────────────────────────────────────────────
const STORAGE_KEY = "ec_pm_chat_history";
let conversationHistory = []; // for Claude API (role/content pairs)

function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.messages && parsed.history) {
        parsed.messages.forEach(m => renderSavedMessage(m));
        conversationHistory = parsed.history;
        return;
      }
    }
  } catch(e) {}
  showWelcome();
}

function saveHistory(renderedMessages) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      messages: renderedMessages,
      history: conversationHistory
    }));
  } catch(e) {}
}

function clearHistory() {
  if (!confirm("¿Borrar toda la conversación?")) return;
  localStorage.removeItem(STORAGE_KEY);
  conversationHistory = [];
  document.getElementById('chat-area').innerHTML = '';
  showWelcome();
}

// ─── Rendered messages store (for persistence) ──────────────────────────
let renderedMessages = [];

function showWelcome() {
  const suggestions = [
    "¿Cómo manejo un cliente que pide cancelar?",
    "Un cliente pide reembolso fuera de los 14 días",
    "¿Cuál es el proceso de onboarding?",
    "Cliente pide entrega urgente para mañana"
  ];
  const html = `
    <div style="padding: 0.5rem 0;">
      <p style="font-size:13.5px; color:var(--text); line-height:1.65; margin-bottom:12px;">Hola 👋 Soy tu asistente de PM. Puedes pegarme mensajes de clientes para que te sugiera cómo responder, o hacerme cualquier consulta sobre procesos de Edit Crew.</p>
      <div class="suggestions">
        ${suggestions.map(s => `<button class="suggestion" onclick="useSuggestion('${s.replace(/'/g, "\\'")}')">${s}</button>`).join('')}
      </div>
    </div>`;
  addBotMessage(html, null, false);
}

// ─── Render helpers ────────────────────────────────────────────────────
function timeStr() {
  return new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}

function addUserMessage(text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg-group';
  div.innerHTML = `
    <div class="msg-row user">
      <div class="avatar pm">PM</div>
      <div class="bubble pm">${text.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="msg-time" style="text-align:right;">${timeStr()}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;

  renderedMessages.push({ type: 'user', text, time: timeStr() });
}

function addTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'msg-row';
  div.innerHTML = `<div class="avatar ec">EC</div><div class="bubble ec"><div class="typing"><span></span><span></span><span></span></div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing-indicator')?.remove();
}

function addBotMessage(htmlContent, metadata, saveable = true) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg-group';
  div.innerHTML = `
    <div class="msg-row">
      <div class="avatar ec">EC</div>
      <div class="bubble ec">${htmlContent}</div>
    </div>
    <div class="msg-time">${timeStr()}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;

  if (saveable) {
    renderedMessages.push({ type: 'bot', html: htmlContent, time: timeStr() });
    saveHistory(renderedMessages);
  }
}

function renderSavedMessage(m) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg-group';
  if (m.type === 'user') {
    div.innerHTML = `
      <div class="msg-row user">
        <div class="avatar pm">PM</div>
        <div class="bubble pm">${m.text.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="msg-time" style="text-align:right;">${m.time}</div>`;
  } else {
    div.innerHTML = `
      <div class="msg-row">
        <div class="avatar ec">EC</div>
        <div class="bubble ec">${m.html}</div>
      </div>
      <div class="msg-time">${m.time}</div>`;
  }
  area.appendChild(div);
  renderedMessages.push(m);
}

// ─── Build response HTML ────────────────────────────────────────────────
function buildTicketHTML(parsed, esc, sopMatches) {
  let html = '';

  // Escalation / checklist banner
  const items = parsed.checklist || [];
  if (esc.level === 'high') {
    const steps = [...items.map(s=>`<li class="danger">${s}</li>`), `<li class="danger">Contacta al PM Lead antes de responder</li>`].join('');
    html += `<div class="mini-banner danger"><div class="mini-banner-body"><div class="mini-banner-title danger">🚨 Riesgo alto — pasos antes de responder</div><ul class="mini-steps">${steps}</ul></div></div>`;
  } else if (esc.level === 'medium') {
    const steps = items.map(s=>`<li class="warning">${s}</li>`).join('');
    html += `<div class="mini-banner warning"><div class="mini-banner-body"><div class="mini-banner-title warning">⚠️ Revisa estos puntos primero</div><ul class="mini-steps">${steps}</ul></div></div>`;
  } else if (items.length) {
    const steps = items.map(s=>`<li class="success">${s}</li>`).join('');
    html += `<div class="mini-banner success"><div class="mini-banner-body"><div class="mini-banner-title success">✓ Sin señales de riesgo</div><ul class="mini-steps">${steps}</ul></div></div>`;
  }

  // SOPs
  if (sopMatches.length) {
    const chips = sopMatches.map(s=>`<a class="sop-chip" href="${s.url}" target="_blank">📄 ${s.name}</a>`).join('');
    html += `<div class="sop-chips">${chips}</div>`;
  }

  // Suggested response
  if (parsed.response) {
    const id = 'r' + Date.now();
    html += `<div class="response-block">
      <div class="response-label">Respuesta sugerida</div>
      <div class="response-text" id="${id}">${parsed.response}</div>
      <button class="copy-btn" onclick="copyText('${id}', this)">Copiar</button>
    </div>`;
  }

  return html;
}

function copyText(id, btn) {
  const text = document.getElementById(id)?.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copiado';
    setTimeout(() => { btn.textContent = 'Copiar'; }, 2000);
  });
}

// ─── Send message ───────────────────────────────────────────────────────
const SYSTEM = `Eres el asistente interno de Edit Crew (Studio Salmon LLC), una agencia de edición de video premium. Ayudas a los Project Managers con dos tipos de consultas:

1. TICKETS DE CLIENTES: cuando te pegan un mensaje de cliente, analizas y devuelves JSON estructurado.
2. PREGUNTAS DE PM: cuando el PM hace una pregunta sobre procesos, políticas, cómo manejar situaciones — respondes conversacionalmente en español, de forma directa y práctica.

TÉRMINOS Y CONDICIONES DE EDIT CREW (aplica siempre):
- Cancelaciones: mínimo 5 días hábiles antes del fin del período. El cliente mantiene acceso hasta el fin del período pagado.
- Reembolsos: solo primeros 14 días para clientes nuevos. Fuera de ese período los pagos no son reembolsables. Se descuentan fees de procesamiento.
- Tiempos de entrega: Essentials = 1-2 días hábiles, Pro = 24h. No recomendado para solicitudes urgentes.
- Revisiones: ilimitadas pero el volumen depende de complejidad y carga del equipo.
- Horas sin usar: no se acumulan al siguiente período.
- Archivos: pueden eliminarse después de 45 días sin actividad.
- Días hábiles: lunes-viernes, 9am-6pm CT (horario de verano) / 8am-5pm CT (invierno).
- AI clips: hasta $5/mes incluidos, uso adicional genera cargo extra.
- No solicitar editores ni empleados de Edit Crew (cláusula de no solicitud 5 años).
- Edit Crew no se responsabiliza por errores en entrega — el cliente debe revisar y notificar.

DETECCIÓN DE TIPO DE MENSAJE:
- Si el mensaje parece ser de un CLIENTE (en inglés, tono de cliente, pidiendo algo): devuelve JSON estructurado así (sin markdown, sin backticks):
{"type":"ticket","sops":["How to Handle Clients","Contingency Plan with Clients"],"checklist":["paso 1","paso 2","paso 3"],"response":"respuesta lista en inglés, primera persona, máximo 90 palabras, firma The Edit Crew Team"}

- Si es una PREGUNTA DEL PM (en español, consultando sobre procesos, cómo manejar algo, etc.): devuelve JSON así:
{"type":"question","sops":["SOP for Account Management","Client Onboardings"],"answer":"respuesta en español, directa y práctica, 2-4 párrafos máximo"}

SOPs disponibles en la Bible (usa los nombres exactos):
"How to Handle Clients", "SOP for Account Management", "Client Portal (ManyRequests)", "Contingency Plan with Clients", "Client Messages & Templates", "Client Onboardings", "Scope of Work", "SOPs for Account Management", "Transitioning an Account to Another PM", "How to Handle Editors", "POI for PMs", "Sheets and Forms", "Suite Studios Wiki"

En ambos casos: nunca prometas cosas que van contra los T&C. En respuestas a clientes: empático pero firme y objetivo.`;

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  addUserMessage(text);
  addTyping();

  conversationHistory.push({ role: "user", content: text });

  try {
    const res = await fetch("/api/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 800,
        system: SYSTEM,
        messages: conversationHistory
      })
    });
    const data = await res.json();
    removeTyping();

    if (data.error) {
      addBotMessage(`<span style="color:var(--danger-text)">Error: ${data.error.message}</span>`);
      document.getElementById('send-btn').disabled = false;
      return;
    }

    const raw = data.content?.[0]?.text || '{}';
    conversationHistory.push({ role: "assistant", content: raw });

    let parsed;
    try { parsed = JSON.parse(raw.replace(/```json|```/g,"").trim()); }
    catch { parsed = { type: "question", answer: raw }; }

    if (parsed.type === "ticket") {
      const esc = getEsc(text);
      // Match SOPs from Claude's named sops + full text
      const fullText = text + " " + (parsed.response || "") + " " + (parsed.checklist || []).join(" ") + " " + (parsed.sops || []).join(" ");
      const sopMatches = getSops(fullText);
      // Also match by Claude's explicit sop names
      if (parsed.sops && parsed.sops.length) {
        parsed.sops.forEach(name => {
          const found = SOPS.find(s => s.name.toLowerCase().includes(name.toLowerCase()) || name.toLowerCase().includes(s.name.toLowerCase().split(" ").slice(0,3).join(" ")));
          if (found && !sopMatches.find(m => m.url === found.url)) sopMatches.push(found);
        });
      }
      const html = buildTicketHTML(parsed, esc, sopMatches.slice(0,3));
      addBotMessage(html || "Sin respuesta generada.");
    } else {
      // For questions, also try to surface relevant SOPs
      const sopMatches = getSops(text + " " + (parsed.answer || ""));
      let html = '';
      const answer = (parsed.answer || raw)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '</p><p style="margin-top:8px;">')
        .replace(/\n/g, '<br>');
      html += `<p>${answer}</p>`;
      if (sopMatches.length) {
        const chips = sopMatches.map(s=>`<a class="sop-chip" href="${s.url}" target="_blank">📄 ${s.name}</a>`).join('');
        html += `<div class="sop-chips" style="margin-top:10px;">${chips}</div>`;
      }
      addBotMessage(html);
    }

  } catch(e) {
    removeTyping();
    addBotMessage(`<span style="color:var(--danger-text)">Error de conexión: ${e.message}</span>`);
  }

  document.getElementById('send-btn').disabled = false;
  input.focus();
  saveHistory(renderedMessages);
}

function useSuggestion(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── Init ───────────────────────────────────────────────────────────────
loadHistory();
</script>
</body>
</html>
